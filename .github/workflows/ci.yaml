name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Forbidden personal files
        run: |
          if git ls-files | grep -E '(^|/)(account\.id|\.env)$|^filters/|^order\.yaml$'; then
            echo "::error::Personal config tracked in git: only *.example templates are allowed"
            exit 1
          fi

      - name: Secret and PII scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    # Steps are skipped until the package exists (Unit 1 adds pyproject.toml and the Makefile).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --python ${{ matrix.python-version }}

      - name: Quality checks
        if: hashFiles('pyproject.toml') != ''
        run: make quality

  ci-ok:
    # The single required status check for branch protection.
    needs: [guard, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
